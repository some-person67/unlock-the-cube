<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Unlock the Cube</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(circle at top left,#2563eb22 0%,transparent 30%),
    radial-gradient(circle at bottom right,#7c3aed22 0%,transparent 30%),
    #0f172a;
  color:white;
  min-height:100vh;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(16px);
  border-right:1px solid rgba(255,255,255,0.08);
  padding:22px;
}

.logo{
  font-size:30px;
  font-weight:800;
  margin-bottom:30px;
}

.sideTitle{
  font-size:12px;
  opacity:0.55;
  text-transform:uppercase;
  margin:18px 0 10px;
  letter-spacing:1px;
}

.eventBtn{
  width:100%;
  border:none;
  background:transparent;
  color:white;
  padding:14px 16px;
  border-radius:14px;
  text-align:left;
  cursor:pointer;
  font-weight:600;
  margin-bottom:8px;
  transition:.2s;
}

.eventBtn:hover{
  background:rgba(255,255,255,0.08);
  transform:translateX(4px);
}

.activeEvent{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
}

/* MAIN */

.main{
  flex:1;
  padding:28px;
}

.topBar{
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-bottom:24px;
}

.hero{
  flex:1;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  padding:30px;
  border-radius:30px;
  box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.hero h1{
  margin:0;
  font-size:42px;
  font-weight:800;
}

.hero p{
  margin-top:10px;
  opacity:.9;
}

.adminPanel{
  width:320px;
}

.modeBox{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:16px;
  font-weight:700;
  margin-bottom:14px;
}

.loginBox{
  display:flex;
  gap:10px;
}

.loginBox input{
  flex:1;
}

/* CARD */

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:30px;
  overflow:hidden;
  backdrop-filter:blur(18px);
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.cardHeader{
  padding:24px 28px;
  border-bottom:1px solid rgba(255,255,255,.08);
  font-size:24px;
  font-weight:800;
}

.tableWrap{
  overflow-x:auto;
}

/* TABLE */

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:rgba(255,255,255,.04);
  color:#93c5fd;
  text-transform:uppercase;
  font-size:12px;
  letter-spacing:1px;
}

th,td{
  padding:16px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,.06);
}

tr:hover{
  background:rgba(255,255,255,.03);
}

/* RANKS */

.rank1{
  background:rgba(250,204,21,.16);
}

.rank2{
  background:rgba(209,213,219,.12);
}

.rank3{
  background:rgba(251,146,60,.12);
}

/* INPUTS */

.scoreInput{
  width:80px;
  text-align:center;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;
  padding:10px;
  color:white;
  outline:none;
}

.scoreInput:focus{
  border-color:#60a5fa;
}

.readonly{
  opacity:.65;
  pointer-events:none;
}

/* BUTTONS */

button{
  border:none;
  border-radius:12px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
}

button:hover{
  opacity:.92;
}

/* MOBILE */

@media(max-width:950px){

  .app{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
  }

  .topBar{
    flex-direction:column;
  }

  .adminPanel{
    width:100%;
  }

}

</style>
</head>
<body>

<div class="app">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">🧩 Unlock the Cube</div>

<div class="sideTitle">Events</div>

<button class="eventBtn activeEvent" onclick="showEvent('333',this)">
3x3 Cube
</button>

<button class="eventBtn" onclick="showEvent('222',this)">
2x2 Cube
</button>

<button class="eventBtn" onclick="showEvent('teamblind',this)">
Team Blind
</button>

<button class="eventBtn" onclick="showEvent('teamsolve',this)">
Team Solve
</button>

<div class="sideTitle">Generate Finals</div>

<button class="eventBtn" onclick="gen333Finals()">
🏆 Generate 3x3 Finals
</button>

<button class="eventBtn" onclick="gen222Finals()">
🏆 Generate 2x2 Finals
</button>

<button class="eventBtn" onclick="genBlindFinals()">
🏆 Generate Blind Finals
</button>

<button class="eventBtn" onclick="genSolveFinals()">
🏆 Generate Solve Finals
</button>

<div class="sideTitle">Finals</div>

<button class="eventBtn" onclick="showEvent('333finals',this)">
🏆 3x3 Finals
</button>

<button class="eventBtn" onclick="showEvent('222finals',this)">
🏆 2x2 Finals
</button>

<button class="eventBtn" onclick="showEvent('teamblindfinals',this)">
🏆 Blind Finals
</button>

<button class="eventBtn" onclick="showEvent('teamsolvefinals',this)">
🏆 Solve Finals
</button>

</div>

<!-- MAIN -->

<div class="main">

<div class="topBar">

<div class="hero">
<h1>Unlock the Cube</h1>
<p>Professional Cubing Competition Dashboard</p>
</div>

<div class="adminPanel">

<div class="modeBox" id="modeBox">
👀 Viewer Mode
</div>

<div class="loginBox">
<input
type="password"
id="adminPass"
placeholder="Admin password"
class="scoreInput"
/>

<button onclick="adminLogin()">
Login
</button>
</div>

</div>

</div>

<div id="content"></div>

</div>

</div>

<script>

/* ======================
   FIREBASE
====================== */

const firebaseConfig = {
  apiKey: "AIzaSyCKnH1kAR0z_3LtsHXNCBKQmF_VJLGl9ls",
  authDomain: "unlock-the-cube-9abea.firebaseapp.com",
  projectId: "unlock-the-cube-9abea"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

/* ======================
   STATE
====================== */

let isAdmin = false;
let current = "333";

let events = {};

/* ======================
   HELPERS
====================== */

function createCompetitor(name){

  return {
    id: crypto.randomUUID(),
    name: name,
    times: ["","","","",""],
    avg: null,
    best: null
  };

}

function createTeam(){

  return {
    id: crypto.randomUUID(),
    name: "Team",
    times: ["","",""],
    avg: null,
    best: null
  };

}

function parseTime(v){

  if(v === "" || v === null) return null;

  if(String(v).toUpperCase() === "DNF"){
    return "DNF";
  }

  return Number(v);

}

function score(v){

  if(v === null || v === "DNF"){
    return Infinity;
  }

  return Number(v);

}

/* ======================
   INIT
====================== */

function init(){

  const names = [
    "ALBERT",
    "CHONG",
    "DARRYL",
    "ETHAN",
    "GUO",
    "HAN",
    "KANG",
    "KHONG",
    "KOH",
    "KOO",
    "KYAN"
  ];

  events = {

    "333": names.map(createCompetitor),

    "222": names.map(createCompetitor),

    "teamblind": Array.from(
      {length:6},
      ()=>createTeam()
    ),

    "teamsolve": Array.from(
      {length:6},
      ()=>createTeam()
    ),

    "333finals": [],
    "222finals": [],
    "teamblindfinals": [],
    "teamsolvefinals": []

  };

}

/* ======================
   FIREBASE SAVE/LOAD
====================== */

async function save(){

  await db
    .collection("competition")
    .doc("main")
    .set(events);

}

async function load(){

  const doc = await db
    .collection("competition")
    .doc("main")
    .get();

  if(doc.exists){

    events = doc.data();

  }else{

    init();
    await save();

  }

  renderAll();

}

/* ======================
   ADMIN
====================== */

function adminLogin(){

  const pass =
    document.getElementById("adminPass").value;

  if(pass === "cubing123"){

    isAdmin = true;

    document.getElementById("modeBox").innerHTML =
      "🛠 Admin Mode";

    renderAll();

  }else{

    alert("Wrong password");

  }

}

/* ======================
   CALCULATIONS
====================== */

function calc(eventName,id){

  const comp =
    events[eventName].find(x=>x.id===id);

  if(!comp) return;

  const parsed =
    comp.times.map(parseTime);

  if(parsed.includes(null)){

    comp.avg = null;
    comp.best = null;
    return;

  }

  const nums =
    parsed.filter(x=>x!=="DNF");

  comp.best =
    nums.length
      ? Math.min(...nums)
      : "DNF";

  const dnfCount =
    parsed.filter(x=>x==="DNF").length;

  /* TEAM EVENTS */

  if(eventName.includes("team")){

    if(dnfCount >= 1){

      comp.avg = "DNF";
      return;

    }

    comp.avg = (
      parsed.reduce((a,b)=>a+b,0)
      / parsed.length
    ).toFixed(2);

    return;

  }

  /* NORMAL EVENTS */

  if(dnfCount >= 2){

    comp.avg = "DNF";
    return;

  }

  if(dnfCount === 1){

    let arr =
      parsed.filter(x=>x!=="DNF");

    arr.splice(
      arr.indexOf(Math.min(...arr)),
      1
    );

    comp.avg = (
      arr.reduce((a,b)=>a+b,0)
      / 3
    ).toFixed(2);

    return;

  }

  let sorted = [...parsed]
    .sort((a,b)=>a-b);

  sorted.shift();
  sorted.pop();

  comp.avg = (
    sorted.reduce((a,b)=>a+b,0)
    / 3
  ).toFixed(2);

}

/* ======================
   UPDATE SCORE
====================== */

function updateTime(
  eventName,
  id,
  index,
  value
){

  const comp =
    events[eventName].find(x=>x.id===id);

  if(!comp) return;

  comp.times[index] = value;

  calc(eventName,id);

  save();

  renderAll();

}

/* ======================
   FINALS
====================== */

function cloneFinal(c,solves){

  return {
    id: crypto.randomUUID(),
    name: c.name,
    times: Array(solves).fill(""),
    avg: null,
    best: null
  };

}

function gen333Finals(){

  if(!isAdmin){
    alert("Admin only");
    return;
  }

  events["333finals"] =
    [...events["333"]]
      .filter(x=>
        x.avg &&
        x.avg !== "DNF"
      )
      .sort((a,b)=>
        score(a.avg)-score(b.avg)
      )
      .slice(0,8)
      .map(x=>cloneFinal(x,5));

  save();
  renderAll();

}

function gen222Finals(){

  if(!isAdmin){
    alert("Admin only");
    return;
  }

  events["222finals"] =
    [...events["222"]]
      .filter(x=>
        x.avg &&
        x.avg !== "DNF"
      )
      .sort((a,b)=>
        score(a.avg)-score(b.avg)
      )
      .slice(0,6)
      .map(x=>cloneFinal(x,5));

  save();
  renderAll();

}

function genBlindFinals(){

  if(!isAdmin){
    alert("Admin only");
    return;
  }

  events["teamblindfinals"] =
    [...events["teamblind"]]
      .filter(x=>
        x.best &&
        x.best !== "DNF"
      )
      .sort((a,b)=>
        score(a.best)-score(b.best)
      )
      .slice(0,4)
      .map(x=>({
        ...x,
        id: crypto.randomUUID(),
        times:["","",""],
        avg:null,
        best:null
      }));

  save();
  renderAll();

}

function genSolveFinals(){

  if(!isAdmin){
    alert("Admin only");
    return;
  }

  events["teamsolvefinals"] =
    [...events["teamsolve"]]
      .filter(x=>
        x.best &&
        x.best !== "DNF"
      )
      .sort((a,b)=>
        score(a.best)-score(b.best)
      )
      .slice(0,4)
      .map(x=>({
        ...x,
        id: crypto.randomUUID(),
        times:["","",""],
        avg:null,
        best:null
      }));

  save();
  renderAll();

}

/* ======================
   NAVIGATION
====================== */

function showEvent(name,btn){

  current = name;

  document
    .querySelectorAll(".eventBtn")
    .forEach(b=>{
      b.classList.remove("activeEvent");
    });

  if(btn){
    btn.classList.add("activeEvent");
  }

  renderAll();

}

/* ======================
   RENDER
====================== */

function renderAll(){

  document.getElementById("content")
    .innerHTML = "";

  render(current);

}

function render(eventName){

  const titles = {

    "333":"3x3 Cube - First Round",
    "222":"2x2 Cube - First Round",
    "teamblind":"Team Blind",
    "teamsolve":"Team Solve",

    "333finals":"🏆 3x3 Finals",
    "222finals":"🏆 2x2 Finals",
    "teamblindfinals":"🏆 Blind Finals",
    "teamsolvefinals":"🏆 Solve Finals"

  };

  const data =
    [...(events[eventName] || [])];

  data.sort((a,b)=>
    score(a.avg)-score(b.avg)
  );

  const cols =
    eventName.includes("team")
      ? 3
      : 5;

  let html = `

  <div class="card">

    <div class="cardHeader">
      ${titles[eventName]}
    </div>

    <div class="tableWrap">

      <table>

        <tr>
          <th>Rank</th>
          <th>Name</th>
  `;

  for(let i=0;i<cols;i++){

    html += `
      <th>Solve ${i+1}</th>
    `;

  }

  html += `
      <th>Average</th>
      <th>Best</th>
    </tr>
  `;

  data.forEach((c,index)=>{

    let rowClass = "";

    if(index===0) rowClass="rank1";
    if(index===1) rowClass="rank2";
    if(index===2) rowClass="rank3";

    html += `
      <tr class="${rowClass}">
    `;

    html += `
      <td>
        <strong>#${index+1}</strong>
      </td>
    `;

    html += `
      <td>${c.name || "Unnamed"}</td>
    `;

    for(let i=0;i<cols;i++){

      html += `
      <td>

      <input
        class="scoreInput ${!isAdmin?'readonly':''}"
        value="${c.times[i] || ''}"
        ${!isAdmin ? 'readonly' : ''}
        onchange="
          updateTime(
            '${eventName}',
            '${c.id}',
            ${i},
            this.value
          )
        "
      />

      </td>
      `;

    }

    html += `
      <td>${c.avg ?? "-"}</td>
      <td>${c.best ?? "-"}</td>
    `;

    html += `</tr>`;

  });

  html += `
      </table>

    </div>

  </div>
  `;

  document.getElementById("content")
    .innerHTML = html;

}

/* ======================
   LIVE FIREBASE SYNC
====================== */

db.collection("competition")
.doc("main")
.onSnapshot(doc=>{

  if(doc.exists){

    events = doc.data();

    renderAll();

    if(isAdmin){

      document.getElementById("modeBox")
        .innerHTML = "🛠 Admin Mode";

    }

  }

});

/* ======================
   START
====================== */

load();

</script>

</body>
</html>
